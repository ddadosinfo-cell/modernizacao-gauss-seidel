name: Testes Online do Algoritmo

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar o código do repositório
      uses: actions/checkout@v4

    - name: Configurar o Python no Servidor Online
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Instalar Dependências do requirements.txt
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Executar Teste de Sintaxe e Importação
      run: |
        python -m py_compile "Mtodo iterativo de Gauss_Seidel.py"